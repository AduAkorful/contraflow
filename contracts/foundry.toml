[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Fixed, never floating — per the repo's global Solidity style rules.
solc_version = "0.8.37"
auto_detect_solc = false
# Confirmed against live research for plans/02-deploy-testnet.md (2026-09-18): Arc mainnet is
# Osaka-active (newer than cancun); Solidity >=0.8.20 contracts compiled with evm_version =
# "cancun" deploy and run correctly on Arc mainnet today. Re-verify at actual mainnet-deploy
# time (03-*.md) since Arc mainnet is very new (launched 2026-09-16) and could still shift.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Fail the build on any compiler warning (unused var, shadowed var, etc.),
# not just errors — catches sloppiness before it reaches a test run.
deny = "warnings"

fs_permissions = [
    { access = "read", path = "./" },
    { access = "read-write", path = "./deployments" },
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
