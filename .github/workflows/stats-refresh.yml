name: Stats refresh

# Keeps the "Live on Arc" stats current. Vercel Hobby crons run at most once a day, so this calls
# the protected incremental endpoint every 5 minutes instead. GitHub may delay scheduled runs.
# Needs the repository secret CRON_SECRET (same value as the Vercel env var). Optional repository
# variable STATS_URL overrides the default endpoint. Each call reads about 5 ranges of 10,000
# blocks (the RPC allows about one call a second), so a first backfill takes about 70 calls.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: stats-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call /api/cron/stats until caught up (max 80 calls)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STATS_URL: ${{ vars.STATS_URL || 'https://contraflow.vercel.app/api/cron/stats' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET secret is not set"; exit 1; fi
          for i in $(seq 1 80); do
            body=$(curl -sS -X POST -H "Authorization: Bearer $CRON_SECRET" -w '\n%{http_code}' "$STATS_URL")
            code=$(echo "$body" | tail -n1); json=$(echo "$body" | sed '$d')
            echo "call $i: HTTP $code $json"
            if [ "$code" = "202" ]; then exit 0; fi           # another refresh holds the lock
            if [ "$code" != "200" ]; then exit 1; fi
            echo "$json" | grep -q '"caughtUp":true' && exit 0
          done
          echo "Not caught up after 80 calls; the next run continues."
